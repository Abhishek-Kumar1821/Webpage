
<html lang="en">
    <style>
        <style>
        /* Resetting some basic styles */
        body, h1, p {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Styling the form container */
        form {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Fieldset styling */
        fieldset {
            border: none;
            padding: 0;
        }
    </style>
    <body>
        <form>
            <fieldset>
                <legend>Registratin</legend>
            <label for="text">Username:</label>
            <input type="text"placeholder="Enter your name"><br><br>
            <label for="email">Email:</label>
            <input type="email" placeholder="Email"><br><br>
            <label for="phone">Ph no:</label>
            <input type="tel" placeholder="phone"><br><br>
            <input type="reset">
            <input type="submit">
            </fieldset>
        </form>
    </body>
</html>
